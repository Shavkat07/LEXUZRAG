# Nginx конфигурация для Lex.uz Legal RAG
# Проксирует запросы на локальный FastAPI сервер (127.0.0.1:8000)

server {
    listen 80;
    server_name _;

    # Максимальный размер тела запроса (для загрузки документов / больших батчей)
    client_max_body_size 50M;

    # Сжатие для быстрой загрузки дашборда и статики
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # Передача оригинальных заголовков клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSockets и Streaming (Server-Sent Events) для ответов LLM
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Отключение буферизации для мгновенной потоковой передачи ответов от LLM
        proxy_buffering off;
        proxy_cache off;

        # Увеличенные таймауты (для глубоких юридических запросов и RAG генерации)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
