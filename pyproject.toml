[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lexuz"
version = "0.2.0"
description = "Legal RAG system for Lex.uz legislation corpus"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "selectolax>=1.0.2",
    "tqdm>=4.66.0",
    "qdrant-client>=1.20.0",
    "FlagEmbedding>=1.3.0",
    "torch>=2.0.0",
]

[project.scripts]
lexuz = "lexuz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lexuz*"]
